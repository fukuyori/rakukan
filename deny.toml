# cargo-deny の設定。CI で `cargo deny check licenses` を実行し、配布物にリンクする crate に
# ここに無いライセンスが入ったら止める（第三者のライセンスの一覧は scripts/gen-third-party-licenses.ps1）。

[graph]
targets = ["x86_64-pc-windows-msvc"]
exclude-dev = true

[licenses]
confidence-threshold = 0.8
# MPL-2.0: option-ext（dirs 経由で hf-hub が使う）。ファイル単位のコピーレフトで、変更せずに使う
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# rakukan 自身の crate（publish = false）は対象にしない
ignore = true
