# Makefile.toml - rakukan build tasks
# cargo make <task>
#
# 標準のビルド & インストールフロー:
#   1. cargo make build-engine   engine DLL (cpu/vulkan/cuda) をビルド
#   2. cargo make build-tsf      tsf/tray/host/dict-builder/WinUI をビルド
#   3. sudo cargo make install   インストーラーを署名なしで作り、サイレント実行 (%ProgramFiles%\rakukan)  ★管理者必要
#   4. PC を再起動                インストールの完了
#
# まとめて実行したい場合 (開発用、署名なし):
#   cargo make full-install      build-engine + build-tsf + install
#   cargo make quick-install     build-tsf + install (engine 使いまわし)
#
# 配布物:
#   cargo make package           sign → 署名付きインストーラー (output\rakukan-<version>-setup.exe)
#
# その他:
#   cargo make uninstall          アンインストーラーをサイレント実行 (完了には再起動)  ★管理者必要
#   cargo make build-engine-full  engine DLL フルクリーンビルド (llama CUDA キャッシュも削除、低速)
#   cargo make check              型チェック (高速)
#   cargo make test               エンジン単体テスト
#   cargo make check-env          ビルドに必要な開発環境の確認
#   cargo make setup-env          開発環境を winget で導入 (管理者推奨)

[config]
default_to_workspace = false

# ─────────────────────────────────────────────────────────────────────────────
# コアタスク (ビルド → インストール / 署名 → 配布物)
# ─────────────────────────────────────────────────────────────────────────────

[tasks.build-engine]
description = "① engine DLL (cpu/vulkan/cuda) をビルド"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\build-engine.ps1", "-Profile", "release"]

[tasks.build-tsf]
description = "② tsf + tray + host + dict-builder + WinUI settings をビルド"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\build-tsf.ps1", "-Profile", "release"]

[tasks.build-tsf-fault-test]
description = "#65 故障試験用 TSF を通常版と別の出力先へビルド（インストールしない）"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\build-tsf.ps1", "-Profile", "release", "-ConfigWatchFaultTest", "-BuildDir", "target\\config-watch-fault-test"]

[tasks.build-tsf-normal-restore]
description = "#65 故障試験後に戻す通常版を別の出力先へビルド（インストールしない）"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\build-tsf.ps1", "-Profile", "release", "-BuildDir", "target\\config-watch-normal-restore"]

[tasks.install]
description = "③ インストーラーを署名なしで作り、サイレント実行 (完了には再起動) ★管理者必要"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\build-installer.ps1", "-Profile", "release", "-Install"]

[tasks.sign]
description = "ビルド成果物に電子署名 (signtool。cargo make package が先に実行する)"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\sign-artifacts.ps1", "-Profile", "release"]

[tasks.package]
description = "配布物: sign → 署名付きインストーラー (setup とアンインストーラーにも署名)"
dependencies = ["sign"]
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\build-installer.ps1", "-Profile", "release", "-Sign"]

[tasks.install-tsf-fault-test]
description = "#65 故障試験用 TSF DLL だけを差し替え・登録 (開発専用) ★管理者必要"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\dev-swap-tsf.ps1", "-Profile", "release", "-BuildDir", "target\\config-watch-fault-test"]

[tasks.install-tsf-normal-restore]
description = "#65 通常版 TSF DLL だけを復元・登録 (開発専用) ★管理者必要"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\dev-swap-tsf.ps1", "-Profile", "release", "-BuildDir", "target\\config-watch-normal-restore"]

# ─────────────────────────────────────────────────────────────────────────────
# まとめ実行 (開発用、署名なし)
# ─────────────────────────────────────────────────────────────────────────────

[tasks.full-install]
description = "build-engine + build-tsf + install を一括実行 (開発用、署名なし)"
dependencies = ["build-engine", "build-tsf", "install"]

[tasks.quick-install]
description = "build-tsf + install のみ (engine 使いまわし、開発用、署名なし)"
dependencies = ["build-tsf", "install"]

# ─────────────────────────────────────────────────────────────────────────────
# その他
# ─────────────────────────────────────────────────────────────────────────────

[tasks.build-engine-full]
description = "engine DLL フルクリーンビルド (llama CUDA キャッシュも削除、低速)"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\build-engine.ps1", "-Profile", "release", "-FullClean"]

[tasks.uninstall]
description = "インストーラーのアンインストーラーをサイレント実行 (完了には再起動) ★管理者必要"
# cargo-make が書き出す一時ファイルは BOM なしなので、Windows PowerShell 5.1 で読めるよう ASCII だけで書く
script_runner = "powershell"
script_extension = "ps1"
script_runner_args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File"]
script = '''
$ErrorActionPreference = "Stop"
# AppId of rakukan_installer.iss. The installer runs in 64-bit mode, so the entry is in the native view
# (the WOW6432Node entry belongs to the 32-bit installers of 0.13.0 and earlier in %LOCALAPPDATA%).
$key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{B7C4E2A1-3F8D-4C91-B5A0-D2E6F9183047}_is1"
if (-not (Test-Path -LiteralPath $key)) { Write-Host "[uninstall] Rakukan IME is not installed."; exit 0 }
$exe = (Get-ItemProperty -LiteralPath $key).UninstallString.Trim('"')
if (-not (Test-Path -LiteralPath $exe)) { Write-Host "[uninstall] Uninstaller not found: $exe"; exit 1 }
Write-Host "[uninstall] $exe"
# The first phase of the Inno uninstaller waits for the uninstall to finish and returns its exit code.
$proc = Start-Process -FilePath $exe -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru
$null = $proc.Handle
$proc.WaitForExit()
Write-Host "[uninstall] exit code: $($proc.ExitCode)"
if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
Write-Host "[uninstall] Done. Restart the PC to finish (files in use are removed at restart)."
'''

[tasks.check]
description = "型チェックのみ (高速)"
command = "cargo"
args = ["check", "-p", "rakukan-tsf"]

[tasks.test]
description = "エンジン単体テスト"
command = "cargo"
args = ["test", "-p", "rakukan-engine", "--", "--nocapture"]

[tasks.check-env]
description = "ビルドに必要な開発環境を確認 (Rust / VS Build Tools / LLVM / .NET SDK など)"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\check-env.ps1"]

[tasks.setup-env]
description = "開発環境を winget で導入 (管理者推奨)"
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "scripts\\setup-env.ps1"]

[tasks.default]
alias = "quick-install"
