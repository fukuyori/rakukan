name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  # ── Phase 0〜2: エンジン・gRPC のビルド＆テスト ──
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # karukan-core の llama.cpp を取得

      - name: Rust ツールチェーン設定
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # llama.cpp のビルドキャッシュ（最重要）
      # llama.cpp の C++ コンパイルは数分かかるため必須
      - name: キャッシュ（cargo + llama.cpp ビルド成果物）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: ビルド確認（cargo check）
        run: cargo check --workspace

      - name: テスト実行
        run: cargo test --workspace
        env:
          # llama.cpp のビルドで MSVC のパス長制限に当たることがある
          # TrackFileAccess を無効化することで回避
          TrackFileAccess: "false"

      - name: Clippy（静的解析）
        run: cargo clippy --workspace -- -D warnings

  # ── フォーマットチェック（Linux で高速に実行）──
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── 配布物にリンクする crate のライセンス（deny.toml。一覧は scripts/gen-third-party-licenses.ps1）──
  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # ── 第三者のライセンスの一覧（Rust の crate と、設定アプリの NuGet のパッケージ）──
  third-party:
    name: Third-Party Licenses (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-about を入れる
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: crate のソースを取る
        run: cargo fetch
      - name: Rust の crate の一覧が依存と合っているか
        shell: pwsh
        run: ./scripts/gen-third-party-licenses.ps1 -Check
      - name: 設定アプリの NuGet のパッケージが許可の一覧と合っているか
        shell: pwsh
        run: |
          dotnet restore apps/rakukan-settings-winui/Rakukan.Settings.WinUI.csproj --configfile apps/rakukan-settings-winui/NuGet.Config -p:Platform=x64
          ./scripts/check-bundled-licenses.ps1
