[package]
name = "rakukan-engine-rpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "rakukan エンジンのプロセス間 RPC（Named Pipe + postcard）"

[dependencies]
rakukan-engine-abi = { path = "../rakukan-engine-abi" }
anyhow   = { workspace = true }
tracing  = { workspace = true }
serde    = { workspace = true }
postcard = { version = "1", features = ["use-std"] }
# 設定の版の照合（config.toml の本文のハッシュ）と、最後に採用した設定の保存（#66）
sha2       = "0.10"
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# spawn_log_env が作る RAKUKAN_LOG を、engine DLL と同じ EnvFilter で解釈して確かめる
tracing-subscriber = { workspace = true }

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
]
